ily="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="0.3">confirm. registrada</text><rect x="540" y="370" width="124" height="44" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.6"/><text x="602.0" y="390.0" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">DONE</text><text x="602.0" y="404.0" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="0.3">resultado + cierre</text><rect x="40" y="370" width="124" height="44" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3"/><text x="102.0" y="390.0" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">HANDOFF</text><text x="102.0" y="404.0" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="0.3">caso humano creado</text><rect x="290" y="370" width="124" height="44" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3"/><text x="352.0" y="390.0" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">FAILURE</text><text x="352.0" y="404.0" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="0.3">se disculpa, deriva</text></g><text x="30" y="520" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start" font-style="italic">next_fsm(state, failures, tool, result) corre en el callback after_tool de ambos agentes. Cada transición</text><text x="30" y="540" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#4f5d75" text-anchor="start" font-style="italic">publica el texto de paso de ese estado como {fsm_instructions}, así la siguiente llamada al modelo ya lo ve.</text><text x="30" y="570" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5a6580" text-anchor="start" letter-spacing="0.3">lookupBooking ok → TRIAGE desde cualquier estado · pares (tool, estado) no listados: mismo estado · DONE es el foco</text></svg>