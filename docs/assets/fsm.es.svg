<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d"><title id="t">Máquina de estados de la conversación de Escala</title><desc id="d">Estados IDENTIFY, TRIAGE, FAQ, OPTIONS, CONFIRM, DONE, HANDOFF y FAILURE con los resultados de herramientas que disparan cada transición.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2d3142"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4f5d75"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#bf4520"/></marker><marker id="a-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2e5aa8"/></marker><marker id="a-rule" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#bfc0c0"/></marker><marker id="a-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5a6580"/></marker></defs><rect width="760" height="600" fill="#f5f5f5"/><text x="30" y="36" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" font-weight="500" fill="#bf4520" text-anchor="start" letter-spacing="1.4">MÁQUINA DE ESTADOS · CALLBACK TRACK_STATE</text><text x="30" y="70" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" fill="#2d3142" text-anchor="start">FSM de la conversación</text><text x="30" y="92" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" text-anchor="start">Ocho estados, una función de transición pura. El modelo nunca fija el estado.</text><g transform="translate(30,70)"><path d="M26 82 L40 82" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M164 82 L290 82" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="227" y="74" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.3">lookupBooking ok</text><path d="M414 82 L540 82" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="477" y="72" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.3">getRebookingOptions</text><text x="477" y="98" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="middle" letter-spacing="0.3">ok · 1+ cotizaciones</text><path d="M352 104 L352 200" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="360" y="156" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.3">searchFaq ok</text><path d="M602 104 L602 200" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="594" y="150" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end" letter-spacing="0.3">record_quote_confirmation ok</text><path d="M602 244 L602 370" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="594" y="310" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="end" letter-spacing="0.3">createRebooking ok</text><path d="M227 310 L102 310 L102 370" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="110" y="346" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.3">createHandoffCase ok</text><path d="M227 310 L352 310 L352 370" fill="none" stroke="#4f5d75" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="360" y="334" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.3">sin cotizaciones</text><text x="360" y="346" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.3">código de error bloqueante</text><text x="360" y="358" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="400" fill="#4f5d75" text-anchor="start" letter-spacing="0.3">2 errores reintentables</text><circle cx="20" cy="82" r="6" fill="#2d3142"/><circle cx="227" cy="310" r="3.5" fill="#4f5d75"/><text x="227" y="298" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" font-weight="500" fill="#5a6580" text-anchor="middle" letter-spacing="1.4">DESDE CUALQUIER ESTADO</text><text x="20" y="100" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" font-weight="400" fill="#5a6580" text-anchor="middle" letter-spacing="0.3">inicio</text><rect x="40" y="60" width="124" height="44" rx="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="102.0" y="80.0" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">IDENTIFY</text><text x="10