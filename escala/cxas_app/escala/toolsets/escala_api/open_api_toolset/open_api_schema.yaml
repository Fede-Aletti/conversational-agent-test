openapi: 3.0.3
info:
  title: Escala airline mock backend
  version: 1.0.0
servers:
  - url: https://api-nam423zy2q-uc.a.run.app
paths:
  /bookings/lookup:
    get:
      operationId: lookupBooking
      summary: Identify a booking and return its state.
      parameters:
        - name: last_name
          in: query
          required: true
          schema: { type: string }
        - name: pnr
          in: query
          required: false
          description: Booking code.
          schema: { type: string }
        - name: flight_date
          in: query
          required: false
          description: Fallback without PNR, YYYY-MM-DD.
          schema: { type: string, format: date }
        - name: origin
          in: query
          required: false
          description: Fallback without PNR, IATA code.
          schema: { type: string }
        - name: destination
          in: query
          required: false
          description: Fallback without PNR, IATA code.
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /flights/{flight_number}/status:
    get:
      operationId: getFlightStatus
      summary: Current status of one flight.
      parameters:
        - name: flight_number
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: query
          required: true
          description: YYYY-MM-DD.
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /disruptions/{pnr}/options:
    post:
      operationId: getRebookingOptions
      summary: Rebooking options with quotes for the whole itinerary.
      parameters:
        - name: pnr
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deadline:
                  type: string
                  description: Involuntary change - today, tomorrow or YYYY-MM-DD.
                target_date:
                  type: string
                  format: date
                  description: Voluntary change - desired date.
                destination:
                  type: string
                  description: IATA code; unsupported.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /rebookings:
    post:
      operationId: createRebooking
      summary: Execute one confirmed quote (simulated payment).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, confirmed, confirmed_total_ars, idempotency_key]
              properties:
                quote_id:
                  type: string
                confirmed:
                  type: boolean
                confirmed_total_ars:
                  type: integer
                  description: Must equal the quoted total.
                idempotency_key:
                  type: string
                  description: rebook-<quote_id>.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /handoff-cases:
    post:
      operationId: createHandoffCase
      summary: Create a human handoff case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, summary, idempotency_key]
              properties:
                reason:
                  type: string
                summary:
                  type: string
                pnr:
                  type: string
                idempotency_key:
                  type: string
                  description: handoff-<PNR or NOPNR>-<n>.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /policies/faq:
    get:
      operationId: searchFaq
      summary: Airline FAQ answers with source.
      parameters:
        - name: q
          in: query
          required: true
          description: Question, in Spanish.
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidRequest'
components:
  responses:
    Ok:
      description: Result or error envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
    InvalidRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
